name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tools for the backup script tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone sqlite3
      - run: npm test

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: linksnip:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and wait for /healthz
        run: |
          docker run -d --name linksnip -e SESSION_SECRET="$(openssl rand -hex 32)" -e IP_HASH_SECRET="$(openssl rand -hex 32)" -p 127.0.0.1:8081:8081 linksnip:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/healthz; then
              echo; echo "Healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "No healthy response within 60s"; docker logs linksnip; exit 1
      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: linksnip:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
