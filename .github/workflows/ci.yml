name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: linksnip:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and wait for /healthz
        run: |
          docker run -d --name linksnip -e SESSION_SECRET="$(openssl rand -hex 32)" -p 127.0.0.1:8081:8081 linksnip:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/healthz; then
              echo; echo "Healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "No healthy response within 60s"; docker logs linksnip; exit 1
