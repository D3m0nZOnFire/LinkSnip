name: PR status labels

# One status label per pull request (logic in .github/scripts/prStatus.js):
#   work-in-progress  draft
#   ready-to-test     CI green and not a draft
#   needs-fixes       CI failed
#
# pull_request_target and workflow_run run the base branch's code with a token that
# can label PRs from forks. Neither checks out or runs the pull request's code.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const { run } = require('./.github/scripts/prStatus.js');
            await run({ github, context });
